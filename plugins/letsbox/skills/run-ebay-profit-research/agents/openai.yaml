interface:
  display_name: "Lets Box Remote eBay Research"
  short_description: "Lets PluginのRemote MCPでeBay利益リサーチを完遂"
  default_prompt: "$letsbox:run-ebay-profit-research を使い、Lets PluginのRemote MCP版でeBay利益リサーチを最後まで実行して。ローカル版は使用しないで。"
dependencies:
  tools:
    - type: "mcp"
      value: "letsbox"
      description: "Tenant-isolated Lets Box research campaigns and gated updates"
      transport: "streamable_http"
      url: "https://mcp.letsai.team/mcp"
policy:
  allow_implicit_invocation: false
