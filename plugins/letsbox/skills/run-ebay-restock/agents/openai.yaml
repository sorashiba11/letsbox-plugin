interface:
  display_name: "Lets Box Remote eBay Restock"
  short_description: "Lets PluginのRemote MCPでeBay在庫戻しを完遂"
  default_prompt: "$letsbox:run-ebay-restock を使い、Lets PluginのRemote MCP版でeBay在庫戻しを最後まで実行して。readモードと最安値更新は使用しないで。"
dependencies:
  tools:
    - type: "mcp"
      value: "letsbox"
      description: "Tenant-isolated Lets Box Research and Restock campaigns with gated EPS writes"
      transport: "streamable_http"
      url: "https://mcp.letsai.team/mcp"
policy:
  allow_implicit_invocation: false
